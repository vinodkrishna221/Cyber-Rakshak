<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="saffronGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA24C" />
      <stop offset="100%" stop-color="#FF8F1F" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF8F1F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Mark (Left) -->
  <g transform="translate(4, 4)">
    <!-- Outer Rings -->
    <circle cx="28" cy="28" r="27" fill="#FFFDF7" stroke="#FF8F1F" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="28" cy="28" r="24" fill="url(#saffronGradFull)" filter="url(#logoGlow)"/>

    <!-- Subtle Radar / Cyber Grid Rings -->
    <circle cx="28" cy="28" r="18" stroke="white" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="2 2"/>

    <!-- Protective Shield -->
    <path d="M28 12L39.5 17V27C39.5 35 34.5 41.5 28 44C21.5 41.5 16.5 35 16.5 27V17L28 12Z" fill="white" fill-opacity="0.95"/>
    <path d="M28 15L37.5 19V27C37.5 33.5 33.5 39 28 41C22.5 39 18.5 33.5 18.5 27V19L28 15Z" stroke="#FF8F1F" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Checkmark -->
    <path d="M23.5 27.5L26.5 30.5L32.5 24.5" stroke="#FF8F1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography (Right) -->
  <text x="70" y="33" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0B1F3A" letter-spacing="-0.5">
    Cyber Rakshak
  </text>
  <text x="70" y="47" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FF8F1F" letter-spacing="0.5">
    AI CYBER ASSISTANT
  </text>
</svg>
